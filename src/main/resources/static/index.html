<!DOCTYPE html>
<html lang="en">    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ink Cost Estimator</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            

            <h1>Ink Cost Estimator</h1>
            
            <div>
                <form id="inkCostForm">
                    
                    <!-- WRAPPER FOR 2 COLUMNS -->
                    <div class="form-columns">
                        
                        <!-- LEFT SIDE -->
                        <div class="left-column">
                            <label for="printer_type">Printer Type:</label>
                            <select id="printer_type" name="printer_type">
                                <option value="inkjet">Inkjet</option>
                                <option value="laser">Laser</option>
                            </select>
                            
                            <label for="covarage_percentage">ISO Coverage %:</label>
                            <input type="number" id="covarage_percentage" value="5" name="covarage_percentage" title='The percentage of the page that will be covered by ink according to ISO standards specified by the manufacturer' placeholder="Coverage percentage" required>

                            <label for="color_capability">Printer Color Capability:</label>
                            <select id="color_capability" name="color_capability">
                                <option value="color">Full Color (CMYK)</option>
                                <option value="Monochrome">Monochrome (Black & White)</option>
                            </select>

                            <div id="colorType">
                                <h3>Are you printing in black & white or full color?</h3>
                                <select id="colorTypeSelect" name="colorTypeSelect">
                                    <option value="fullColor">Full Color</option>
                                    <option value="Monochrome">Black & White</option>
                                </select>
                            </div>
                            
                            <div id="paperCostdiv">
                                <h3>Paper Costs</h3>

                                <!-- This container holds all the groups side-by-side -->
                                <div class="paper-inputs-row">

                                    <div class="input-group">
                                        <label for="A4">A4:</label>
                                        <input type="number" id="A4" min="0" step="any" name="paperCost" placeholder="Price" required>
                                    </div>

                                    <div class="input-group">
                                        <label for="A3">A3:</label>
                                        <input type="number" id="A3" min="0" step="any" name="paperCost" placeholder="Price" required>
                                    </div>

                                    <div class="input-group">
                                        <label for="A5">A5:</label>
                                        <input type="number" id="A5" min="0" step="any" name="paperCost" placeholder="Price" required>
                                    </div>
                                    <div class="input-group">
                                        <label for="Legal">Legal:</label>
                                        <input type="number" id="Legal" min="0" step="any" name="paperCost" placeholder="Price" required>
                                    </div>

                                </div>
                            </div>
                        </div>

                        <!-- RIGHT SIDE -->
                        <div class="right-column">
                            <div id="monochrome">
                                <h3>Black Cartridge</h3>
                                <!-- Side-by-side inputs -->
                                <div class="input-row">
                                    <input type="number" id="monochrome_cost" min="0" step="any" name="monochrome_cost" placeholder="Price"  required>
                                    <input type="number" id="monochrome_yield" min="0" step="any" name="monochrome_yield" title="how many papers can a single catridge be used for?" placeholder="Yield" required>
                                </div>
                            </div>

                            <div id="full_color">
                                <h3>Color Cartridges</h3>
                
                                <label>Cyan:</label>
                                <!-- Side-by-side inputs -->
                                <div class="input-row">
                                    <input type="number" id="cyanPrice" min="0" step="any" placeholder="Price" >
                                    <input type="number" id="cyanYield" min="0" step="any" title="how many papers can a single catridge be used for?" placeholder="Yield" >
                                </div>

                                <label>Magenta:</label>
                                <!-- Side-by-side inputs -->
                                <div class="input-row">
                                    <input type="number" id="magentaPrice" min="0" step="any" placeholder="Price" >
                                    <input type="number" id="magentaYield" min="0" step="any" title="how many papers can a single catridge be used for?" placeholder="Yield" >
                                </div>

                                <label>Yellow:</label>
                                <!-- Side-by-side inputs -->
                                <div class="input-row">
                                    <input type="number" id="yellowPrice" min="0" step="any" placeholder="Price" >
                                    <input type="number" id="yellowYield" min="0" step="any" title="how many papers can a single catridge be used for?" placeholder="Yield" >
                                </div>
                            </div>
                        </div>
                    </div> <!-- End of Form Columns -->
                
                    <!-- BUTTONS AT THE BOTTOM -->
                    <div class="form-actions">
                        <button type="submit">save</button>
                        <button type="button" id="updateButton">update</button>
                        <button type="button" id="clear_settings">Clear Settings</button>
                        <span id="settingsStatus"></span>
                    </div>
                </form>

                <hr>
                
                <div class="upload-container">
                    <div class="upload-section">
                        <form id="uploadForm" class="job-settings-form">
                            <h3>PDF Job Settings & Estimation</h3>

                            <!-- STEP 1: Paper Stock Selection -->
                            <div class="job-step">
                                <h4>1. Target Paper Size</h4>
                                <select id="targetPaperSize" name="targetPaperSize">
                                    <option value="A4">A4 (Standard)</option>
                                    <option value="A3">A3 (Scaled Up - Double Area)</option>
                                    <option value="A5">A5 (Scaled Down - Half Area)</option>
                                    <option value="Legal">Legal</option>
                                </select>
                            </div>
                        
                            <!-- STEP 2: Imposition & Layout Rules -->
                            <div class="job-step">
                                <h4>2. Layout & Sides</h4>
                                <!-- Leveraging your existing side-by-side flexbox class -->
                                <div class="input-row">
                                    <div style="flex: 1;">
                                        <label for="printMode">Print Mode:</label>
                                        <select id="printMode" name="printMode">
                                            <option value="standard">Standard (1-Up)</option>
                                            <option value="booklet">Booklet (Folded A5)</option>
                                            <option value="2up">2-Up (2 slides per sheet)</option>
                                            <option value="4up">4-Up (4 slides per sheet)</option>
                                        </select>
                                    </div>
                                    <div style="flex: 1;">
                                        <label for="duplexMode">Sides:</label>
                                        <select id="duplexMode" name="duplexMode">
                                            <option value="simplex">Single-Sided</option>
                                            <option value="duplex">Double-Sided</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        
                            <!-- STEP 3: Page Selection & Color Mapping -->
                            <div class="job-step">
                                <h4>3. Custom Page Ranges (Optional)</h4>
                                <label for="colorPages">Color Pages (e.g., 1, 4-6, 12):</label>
                                <input type="text" id="colorPages" placeholder="Leave empty to analyze all pages" name="colorPages">

                                <label for="monoPages">Monochrome Pages (e.g., 2-3, 7-11):</label>
                                <input type="text" id="monoPages" placeholder="Leave empty if none" name="monoPages">
                            </div>

                            <!-- STEP 4: Upload & Calculate -->
                            <div class="job-step upload-step">
                                <h4>4. Upload Document</h4>
                                <input type="file" id="pdfFileInput" accept="application/pdf" required>
                                <button type="submit" style="width: 100%; margin-top: 15px;">Analyze PDF & Calculate Job Cost</button>
                            </div>
                        </form>
                    </div>
                    
                    <div id="uploadStatus" class="status-section">
                        <!-- Status messages will appear here -->
                    </div>
                </div>
                <hr>
            </div>
            
            <div id="result"></div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
